<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande d'établissement - CERES Scolarité</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .required {
            color: #e74c3c;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(0, 0, 0, 0.3);
            border-top-color: #0c5460;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .success-icon {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 CERES Scolarité</h1>
            <p>Demande d'accès à la plateforme</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="demandForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="nom_etablissement">
                    Nom de l'établissement <span class="required">*</span>
                </label>
                <input
                    type="text"
                    id="nom_etablissement"
                    name="nom_etablissement"
                    required
                    placeholder="ex: Lycée de N'Djaména"
                >
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="ville">
                        Ville <span class="required">*</span>
                    </label>
                    <input
                        type="text"
                        id="ville"
                        name="ville"
                        required
                        placeholder="ex: N'Djaména"
                    >
                </div>
                <div class="form-group">
                    <label for="province">
                        Province/Région <span class="required">*</span>
                    </label>
                    <input
                        type="text"
                        id="province"
                        name="province"
                        required
                        placeholder="ex: Logone Occidental"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="nom_directeur">
                    Nom du directeur <span class="required">*</span>
                </label>
                <input
                    type="text"
                    id="nom_directeur"
                    name="nom_directeur"
                    required
                    placeholder="ex: Maïmos Arsène"
                >
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="telephone">
                        Téléphone <span class="required">*</span>
                    </label>
                    <input
                        type="tel"
                        id="telephone"
                        name="telephone"
                        required
                        placeholder="ex: +235 61 23 45 67"
                    >
                </div>
                <div class="form-group">
                    <label for="email">
                        Email <span class="required">*</span>
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="ex: contact@etablissement.td"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="formule_souhaitee">
                    Formule souhaitée <span class="required">*</span>
                </label>
                <select id="formule_souhaitee" name="formule_souhaitee" required>
                    <option value="">-- Sélectionner une formule --</option>
                    <option value="Formule Basique">Formule Basique</option>
                    <option value="Formule Standard">Formule Standard</option>
                    <option value="Formule Premium">Formule Premium</option>
                    <option value="Formule Entreprise">Formule Entreprise</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">
                    Message supplémentaire
                </label>
                <textarea
                    id="message"
                    name="message"
                    placeholder="Informations supplémentaires (optionnel)..."
                ></textarea>
            </div>

            <button type="submit">Soumettre ma demande</button>
        </form>
    </div>

    <script>
        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert show ${type}`;

            if (type === 'loading') {
                alertBox.innerHTML = `<span class="spinner"></span>${message}`;
            } else if (type === 'success') {
                alertBox.innerHTML = `<span class="success-icon">✓</span>${message}`;
            } else {
                alertBox.innerHTML = message;
            }
        }

        function hideAlert() {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = 'alert';
        }

        async function handleSubmit(event) {
            event.preventDefault();

            const form = document.getElementById('demandForm');
            const button = form.querySelector('button');

            // Récupérer les données du formulaire
            const formData = {
                nom_etablissement: document.getElementById('nom_etablissement').value,
                ville: document.getElementById('ville').value,
                province: document.getElementById('province').value,
                nom_directeur: document.getElementById('nom_directeur').value,
                telephone: document.getElementById('telephone').value,
                email: document.getElementById('email').value,
                formule_souhaitee: document.getElementById('formule_souhaitee').value,
                message: document.getElementById('message').value,
            };

            // Afficher le message de chargement
            showAlert('Traitement de votre demande...', 'loading');
            button.disabled = true;

            try {
                const response = await fetch('/.netlify/functions/demander-etablissement', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData),
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert('✓ Votre demande a été envoyée avec succès! Nous vous contacterons bientôt.', 'success');
                    form.reset();
                    button.disabled = false;
                } else if (response.status === 201) {
                    showAlert('⚠ Email envoyé, mais erreur de sauvegarde. Nous reviendrons vers vous.', 'loading');
                    button.disabled = false;
                } else {
                    showAlert(`Erreur: ${result.error || 'Impossible de traiter votre demande'}`, 'error');
                    button.disabled = false;
                }
            } catch (error) {
                showAlert('Erreur de connexion. Vérifiez votre internet et réessayez.', 'error');
                button.disabled = false;
                console.error('Erreur:', error);
            }
        }
    </script>
</body>
</html>
