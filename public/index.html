// Synchronise chaque table séparément (upsert + suppression des lignes disparues).
// Simplification assumée pour ce stade pilote : on renvoie le tableau complet à
// chaque changement plutôt qu'un calcul fin de ce qui a précisément changé.
async function synchroniserAvecSupabase(prev, next) {
    const etabId = next.etablissementId;
    await upsertTable("classes", next.classes.map((c) => ({ ...c, etablissementId: etabId })));
    await supprimerLignes("classes", idsDisparus(prev.classes, next.classes));
    const anciensFrais = new Map(prev.frais.map((f) => [f.id, f]));
    const fraisModifies = next.frais.filter((f) =>
        !anciensFrais.has(f.id) || JSON.stringify(f) !== JSON.stringify(anciensFrais.get(f.id)));
    await upsertTable("frais", fraisModifies);
    await supprimerLignes("frais", idsDisparus(prev.frais, next.frais));
    await upsertTable("eleves", next.eleves.map((e) => ({ ...e, etablissementId: etabId })));
    await supprimerLignes("eleves", idsDisparus(prev.eleves, next.eleves));
    // P139 : les échéances sont créées et modifiées par les fonctions serveur.
    // Ne jamais réécrire un grilleSnapshot potentiellement périmé lors d'une
    // sauvegarde sans rapport : il pourrait ressusciter une échéance retirée.
    // P151 : seules les remises NOUVELLES sont envoyées — une remise déjà accordée
    // est immuable côté base (journal + verrou), inutile de la renvoyer.
    const anciennesRemises = new Set(prev.avantages.map((a) => a.id));
    await upsertTable("avantages", next.avantages.filter((a) => !anciennesRemises.has(a.id)));
    // paiements et corrections ne passent plus par ici (P0-11/P0-17) : ils
    // sont créés exclusivement via les fonctions serveur enregistrer_paiements,
    // soumettre_correction et approuver_correction, qui revérifient tout
    // côté base avant d'écrire quoi que ce soit.
    // relances et promesses non plus (ANO-C1, Vague C) : elles passent
    // désormais exclusivement par confirmer_relance et enregistrer_promesse,
    // qui revérifient le reliquat et journalisent l'auteur réel côté base —
    // même principe que P0-11/P0-17 ci-dessus.
    // clotures ne passe plus par ici non plus (P0-29/P0-30) : validation et
    // réouverture passent exclusivement par valider_cloture et
    // reouvrir_cloture, qui recalculent le théorique côté base et ne
    // perdent jamais l'historique des versions précédentes.
}

// brut, avantage, net, payé, reste, statut.
// P1-03 : ne retient, parmi les tranches de scolarité d'une classe, que la
// version actuellement applicable (la plus récente dont la date d'effet est
// déjà passée) — jamais toutes les versions cumulées. Les autres frais

function typeFraisP139(f) {
    return f.typeFrais || (f.estScolarite ? "scolarite" : "optionnel");

function grilleActive(fraisListe, classeId) {
    const items = fraisListe.filter((f) => f.classeId === classeId);
    const aujourdHui = todayISO();
    const scolarite = items.filter((f) => typeFraisP139(f) === "scolarite");
    const versions = scolarite.filter((f) => !f.dateEffet || f.dateEffet <= aujourdHui).map((f) => f.version || 1);
    if (!versions.length) return [];

function computeDossier(eleve, data) {
    const tranches = (eleve.grilleSnapshot || []).map((t) => {
        const avantage = data.avantages
            .filter((a) => a.eleveId === eleve.id && a.echeanceId === t.echeanceId)
            .reduce((s, a) => s + a.montant, 0);
        const paiementsTranche = data.paiements.filter((p) => p.echeanceId === t.echeanceId);
        const paye = paiementsTranche.reduce((s, p) => s + p.montant, 0);
        const corrections = data.corrections.filter((c) => c.statut === "approuvee" && paiementsTranche.some((p) => p.id === c.paiementId));
        const correctionsNet = corrections.reduce((s, c) => s + c.montant, 0);
        const net = Math.max(0, t.montantBrut - avantage);
        const repris = (data.reprises || []).filter((r) => r.echeanceId === t.echeanceId).reduce((s, r) => s + r.montant, 0);
        const payeNet = paye + correctionsNet + repris;
        const reste = Math.max(0, net - payeNet);
        let statut = "Non réglée";
        if (reste <= 0)
            statut = "Réglée";
        else if (payeNet > 0)
            statut = "Partielle";
        if (reste > 0 && t.dateEcheance && t.dateEcheance < todayISO()) {
            statut = payeNet > 0 ? "Partielle — en retard" : "En retard";
        }
        return {
            ...t,
            avantage,
            net,
            paye: payeNet,
            repris,
            reste,
            statut,
        };
    }).sort((a, b) => String(a.annee || "").localeCompare(String(b.annee || ""))
        || ((a.ordre ?? 999) - (b.ordre ?? 999))
        || String(a.dateEcheance || "").localeCompare(String(b.dateEcheance || "")));

        brut: acc.brut + t.montantBrut,
        avantage: acc.avantage + t.avantage,
        net: acc.net + t.net,
        paye: acc.paye + t.paye,
        repris: acc.repris + t.repris,
        reste: acc.reste + t.reste,
        retard: acc.retard + (t.statut.includes("retard") ? t.reste : 0),

function joursDeRetard(dateEcheance) {

}

// retient donc pas ici, même si son montant compte déjà dans le "reste à recouvrer" global.
function listeImpayes(data) {
    const lignes = [];
    data.eleves.forEach((e) => {
        const dossier = computeDossier(e, data);
        dossier.tranches.forEach((t) => {
            if (t.reste > 0 && t.statut.includes("retard")) {

// Statut d'une promesse : ne modifie jamais le payé/reste réel (P0-21) — c'est un simple suivi de parole donnée.
// P1-18 : les 6 statuts prévus au cahier — En attente, Respectée, Régularisée
// tardivement, Partielle, Non tenue, Remplacée, Sans objet.
function statutPromesse(promesse, data) {
    // Remplacée : une promesse plus récente existe pour la même échéance —
    // c'est elle qui fait foi désormais (P1-19 : jamais écrasée, juste dépassée).
    const plusRecente = data.promesses.some((p) => p.echeanceId === promesse.echeanceId && p.dateCreation > promesse.dateCreation);
    if (plusRecente)
        return "Remplacée";
    const paiementsApres = data.paiements.filter((p) => p.echeanceId === promesse.echeanceId && p.date >= promesse.dateCreation);
    const correctionsApres = data.corrections.filter((c) => {
        const p = data.paiements.find((pp) => pp.id === c.paiementId);
        return p && p.echeanceId === promesse.echeanceId && c.date >= promesse.dateCreation;
    });
    const encaisseDepuis = paiementsApres.reduce((s, p) => s + p.montant, 0) + correctionsApres.reduce((s, c) => s + c.montant, 0);
    if (encaisseDepuis >= promesse.montant) {
        const encaisseAvantDate = paiementsApres.filter((p) => p.date <= promesse.date).reduce((s, p) => s + p.montant, 0)
            + correctionsApres.filter((c) => c.date <= promesse.date).reduce((s, c) => s + c.montant, 0);
        return encaisseAvantDate >= promesse.montant ? "Respectée" : "Régularisée tardivement";
    }
    // Sans objet : le reliquat de la tranche a disparu autrement qu'en honorant
    // cette promesse (avantage accordé après coup, correction, transfert...).
    const eleve = data.eleves.find((e) => e.id === promesse.eleveId);
    if (eleve) {
        const dossier = computeDossier(eleve, data);
        const tranche = dossier.tranches.find((t) => t.echeanceId === promesse.echeanceId);
        if (tranche && tranche.reste <= 0)
            return "Sans objet";
    }
    if (promesse.date < todayISO())
        return encaisseDepuis > 0 ? "Partielle" : "Non tenue";
    return "En attente";
}
